name: Scheduled sync

on:
  schedule:
    # Day 0,1,3,5 run once per day at 00:17 UTC.
    - cron: '17 0 * * 0,1,3,5'
    # Day 2,4 run twice per day at 00:17 and 12:17 UTC.
    - cron: '17 0,12 * * 2,4'
    # Day 6 runs three times per day at 00:17, 08:17, and 16:17 UTC.
    - cron: '17 0,8,16 * * 6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update activity marker
        run: ./scripts/update-activity-marker.sh

      - name: Commit activity marker
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: scheduled activity sync'
          file_pattern: data/activity-marker.json
